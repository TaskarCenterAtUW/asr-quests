# @format

name: Deploy Creator to GitHub Pages
on:
  push:
    branches: [main]
    paths: [creator/**]
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: creator
      - run: bun run build
        working-directory: creator
      - uses: actions/upload-pages-artifact@v5
        with: { path: creator/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
