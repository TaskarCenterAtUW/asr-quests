# @format

name: Deploy Creator to GitHub Pages
on:
  push:
    branches: [main]
    paths: [creator/**]
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6
        with:
          {
            node-version: 20,
            cache: npm,
            cache-dependency-path: creator/package-lock.json,
          }
      - run: npm ci
        working-directory: creator
      - run: npm run build
        working-directory: creator
      - uses: actions/upload-pages-artifact@v5
        with: { path: creator/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
